<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e291e"/>
      <stop offset="50%" stop-color="#0f1710"/>
      <stop offset="100%" stop-color="#050805"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <radialGradient id="beacon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Shield -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="94" fill="none" stroke="url(#gold)" stroke-width="8" opacity="0.85"/>

  <!-- Beacon Light Aura -->
  <circle cx="256" cy="230" r="180" fill="url(#beacon)"/>

  <!-- Lighthouse / Citadel Citadel Tower -->
  <path d="M 230 380 L 244 180 L 268 180 L 282 380 Z" fill="#334155" stroke="#64748b" stroke-width="4"/>
  <rect x="238" y="160" width="36" height="24" rx="4" fill="url(#gold)"/>
  <polygon points="256,120 232,160 280,160" fill="#dc2626"/>

  <!-- Crossed Machetes / Swords -->
  <path d="M 140 370 L 372 190" stroke="url(#gold)" stroke-width="14" stroke-linecap="round"/>
  <path d="M 372 370 L 140 190" stroke="url(#gold)" stroke-width="14" stroke-linecap="round"/>

  <!-- Survivor Text -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#fce7b2" text-anchor="middle" letter-spacing="4">THE LAST PORT</text>
  <text x="256" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#86efac" text-anchor="middle" letter-spacing="2">TWD: SURVIVORS</text>
</svg>