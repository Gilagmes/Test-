<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tiles Survival</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        body { 
            background: #1a1a2e; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            color: white;
        }
        #gameCanvas { 
            display: block; 
            background: #16213e;
            image-rendering: pixelated;
        }
        .ui-layer {
            position: fixed;
            top: 0; left: 0; right: 0;
            padding: 10px;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .resources {
            display: flex;
            gap: 15px;
            font-size: 14px;
        }
        .resource-item {
            background: rgba(255,255,255,0.1);
            padding: 5px 10px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }
        .btn {
            background: #e94560;
            border: none;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }
        .btn-voice {
            background: #0f3460;
            border: 2px solid #e94560;
        }
        .btn-voice.active { background: #e94560; }
        
        .clan-panel {
            position: fixed;
            top: 60px;
            right: 10px;
            background: rgba(0,0,0,0.9);
            border-radius: 10px;
            padding: 15px;
            width: 200px;
            display: none;
            z-index: 20;
        }
        .clan-panel.visible { display: block; }
        .member {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 8px 0;
            font-size: 13px;
        }
        .voice-indicator {
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            display: none;
        }
        .voice-indicator.speaking { display: block; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        
        #loading {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid #e94560;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading">
        <div class="loader"></div>
        <p style="margin-top: 20px; color: #e94560;">Загрузка...</p>
    </div>

    <div class="ui-layer">
        <div class="resources">
            <div class="resource-item">🪵 <span id="wood">0</span></div>
            <div class="resource-item">🍖 <span id="food">0</span></div>
            <div class="resource-item">⚡ <span id="energy">100</span></div>
        </div>
        <button class="btn" onclick="toggleClan()" style="padding: 8px 15px; font-size: 14px;">👥 Клан</button>
    </div>

    <div class="clan-panel" id="clanPanel">
        <h3 style="margin-bottom: 10px; color: #e94560;">Клан: Выжившие</h3>
        <div id="clanMembers">
            <div class="member">
                <div class="voice-indicator" id="voice1"></div>
                <span>🎭 Вы</span>
                <button class="btn btn-voice" id="voiceBtn" onclick="toggleVoice()" style="padding: 5px 10px; font-size: 12px; margin-left: auto;">🎤</button>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn" onclick="game.move(-1, 0)">⬅️</button>
        <div style="display: flex; flex-direction: column; gap: 10px;">
            <button class="btn" onclick="game.move(0, -1)">⬆️</button>
            <button class="btn" onclick="game.action()">⚔️</button>
            <button class="btn" onclick="game.move(0, 1)">⬇️</button>
        </div>
        <button class="btn" onclick="game.move(1, 0)">➡️</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script src="voice-chat.js"></script>
    <script src="game.js"></script>
</body>
</html>
